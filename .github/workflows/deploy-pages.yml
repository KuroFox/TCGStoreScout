name: Build TCGplayer data and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "35 21 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure / enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build current TCGplayer snapshot
        run: python scripts/update_tcgplayer.py --output _site/data

      - name: Build Pokémon competitive demand snapshot
        run: python scripts/update_pokemon_competitive.py --output _site/data/competitive/pokemon --days 45 --events 18 --min-players 32

      - name: Copy frontend
        run: |
          cp index.html _site/index.html
          cp style.css _site/style.css
          cp app.js _site/app.js
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
